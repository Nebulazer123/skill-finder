name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run packaged engine smoke tests
        run: python3 -m unittest discover -s skills/skill-finder/tests -v

      - name: Run public package validation
        run: python3 -m unittest discover -s validation -v

      - name: Run evaluation harness
        run: python3 -m unittest discover -s evaluation -v

      - name: Check plugin package sync
        run: python3 scripts/sync_plugin_package.py --check

      - name: Install npm setup dependencies without scripts
        run: npm ci --ignore-scripts

      - name: Check npm dependency tree
        run: npm ls --all
