name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run public package validation
        run: python3 -m unittest discover -s validation -v

      - name: Check plugin package sync
        run: python3 scripts/sync_plugin_package.py --check

      - name: Check npm dependency metadata
        run: npm pkg get dependencies
