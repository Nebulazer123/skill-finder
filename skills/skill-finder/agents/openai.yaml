interface:
  display_name: "Skill Finder"
  short_description: "Find, vet, and prepare skills or task capabilities"
  default_prompt: "Use $skill-finder to find, compare, vet, or improve the best installable skill or capability for my current problem, including dependency readiness."

dependencies:
  tools:
    - type: "mcp"
      value: "github"
      required: true
      description: "Required: GitHub MCP for repo/code search and source verification."
    - type: "mcp"
      value: "deepwiki"
      required: true
      description: "Required: DeepWiki MCP for public repository maps and Ask Devin questions."
    - type: "mcp"
      value: "devin"
      recommended: true
      description: "Highly recommended: Devin MCP for hard repository scans, sessions, playbooks, knowledge, schedules, and integrations."
    - type: "mcp"
      value: "skills-md"
      recommended: true
      description: "Recommended: skills.md remote catalog and hosted skill execution route; inspect pricing and request approval before premium runs."
    - type: "mcp"
      value: "context7"
      required: true
      description: "Required: Context7 MCP for current documentation, including API and MCP documentation."
    - type: "mcp"
      value: "codebase-memory-mcp"
      required: true
      description: "Required: codebase-memory-mcp for local code graph indexing, symbol lookup, call paths, route tracing, and impact analysis."
    - type: "mcp"
      value: "huggingface"
      recommended: true
      description: "Highly recommended when relevant: Hugging Face MCP for Hub model, dataset, Space, paper, eval, and repository discovery."
    - type: "binary"
      value: "rg"
      required: true
      description: "Required: ripgrep for local file inspection."
    - type: "binary"
      value: "skills"
      required: true
      description: "Required: Skills CLI for skills.sh marketplace discovery."
    - type: "binary"
      value: "gh"
      recommended: true
      description: "Recommended: GitHub CLI fallback for repository/source inspection."
    - type: "binary"
      value: "browse"
      required: true
      description: "Required: Browserbase Browse CLI for browser search, fetch, sessions, and Browse.sh skills."
    - type: "binary"
      value: "codebase-memory-mcp"
      required: true
      description: "Required: codebase-memory-mcp CLI installer and local MCP server."
    - type: "binary"
      value: "hf"
      recommended: true
      description: "Highly recommended when relevant: Hugging Face CLI for Hub metadata, repo inspection, dataset/model workflows, and authenticated status checks."
    - type: "binary"
      value: "composio"
      recommended: true
      description: "Recommended for app workflows: Composio CLI for connector discovery, schema inspection, OAuth-backed tool use, and MCP setup."
    - type: "binary"
      value: "python3"
      required: true
      description: "Required: Python runtime for validation and evidence scripts."
    - type: "binary"
      value: "node"
      required: true
      description: "Required: Node.js 18+ runtime for package-tool discovery and MCP setup commands."
    - type: "binary"
      value: "npm"
      required: true
      description: "Required: npm for package metadata, setup dependency checks, and source-backed install commands."
    - type: "binary"
      value: "npx"
      required: true
      description: "Required: npx for skills.sh and Context7 setup commands when no persistent install exists."
