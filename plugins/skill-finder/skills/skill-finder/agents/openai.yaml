interface:
  display_name: "Skill Finder"
  short_description: "Find, vet, and prepare skills or task capabilities"
  default_prompt: "Use $skill-finder to find, compare, vet, or improve the best installable skill or capability for my current problem, including dependency readiness."

dependencies:
  tools:
    - type: "mcp"
      value: "github"
      description: "GitHub MCP for repo/code search."
    - type: "mcp"
      value: "deepwiki"
      description: "DeepWiki MCP for public repository maps and Ask Devin questions."
    - type: "mcp"
      value: "devin"
      description: "Devin MCP for private-repository docs, sessions, playbooks, knowledge, schedules, and integrations."
    - type: "mcp"
      value: "context7"
      description: "Context7 MCP for current documentation, including API and MCP documentation."
    - type: "mcp"
      value: "huggingface"
      description: "Hugging Face MCP for Hub model, dataset, Space, paper, and repository discovery when available."
    - type: "binary"
      value: "rg"
      description: "ripgrep for local file inspection."
    - type: "binary"
      value: "skills"
      description: "Skills CLI for skills.sh marketplace discovery when available."
    - type: "binary"
      value: "gh"
      description: "GitHub CLI fallback for repository/source inspection."
    - type: "binary"
      value: "browse"
      description: "Browserbase Browse CLI for browser search, fetch, sessions, and Browse.sh skills."
    - type: "binary"
      value: "hf"
      description: "Hugging Face CLI for Hub metadata, repo inspection, dataset/model workflows, and authenticated status checks."
    - type: "binary"
      value: "composio"
      description: "Composio CLI for app connector discovery, schema inspection, OAuth-backed tool use, and MCP setup."
    - type: "binary"
      value: "python3"
      description: "Python runtime for validation and evidence scripts."
