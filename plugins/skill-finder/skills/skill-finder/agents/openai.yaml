interface:
  display_name: "Skill Finder"
  short_description: "Find, vet, and prepare skills or task capabilities"
  default_prompt: "Use $skill-finder to find, compare, vet, or improve the best installable skill or capability for my current problem, including dependency readiness."

dependencies:
  tools:
    - type: "mcp"
      value: "github"
      recommended: true
      description: "Conditional: GitHub MCP for repository discovery and source verification."
    - type: "mcp"
      value: "deepwiki"
      recommended: true
      description: "Conditional: DeepWiki MCP for public repository maps and source-path leads."
    - type: "mcp"
      value: "devin"
      recommended: true
      description: "Highly recommended: Devin MCP for hard repository scans, sessions, playbooks, knowledge, schedules, and integrations."
    - type: "mcp"
      value: "skills-md"
      recommended: true
      description: "Recommended: skills.md remote catalog and hosted skill execution route; inspect pricing and request approval before premium runs."
    - type: "mcp"
      value: "context7"
      recommended: true
      description: "Conditional: Context7 MCP for current API, SDK, CLI, and MCP documentation."
    - type: "mcp"
      value: "codebase-memory-mcp"
      recommended: true
      description: "Conditional: codebase-memory-mcp for local symbols, call paths, route tracing, and impact analysis."
    - type: "mcp"
      value: "huggingface"
      recommended: true
      description: "Highly recommended when relevant: Hugging Face MCP for Hub model, dataset, Space, paper, eval, and repository discovery."
    - type: "binary"
      value: "rg"
      required: true
      description: "Required: ripgrep for local file inspection."
    - type: "binary"
      value: "skills"
      recommended: true
      description: "Conditional: Skills CLI for skills.sh marketplace discovery."
    - type: "binary"
      value: "gh"
      recommended: true
      description: "Recommended: GitHub CLI fallback for repository/source inspection."
    - type: "binary"
      value: "browse"
      recommended: true
      description: "Conditional: Browserbase Browse CLI for browser search, fetch, snapshots, and live-page evidence."
    - type: "binary"
      value: "codebase-memory-mcp"
      recommended: true
      description: "Conditional: codebase-memory-mcp CLI installer and local MCP server."
    - type: "binary"
      value: "hf"
      recommended: true
      description: "Highly recommended when relevant: Hugging Face CLI for Hub metadata, repo inspection, dataset/model workflows, and authenticated status checks."
    - type: "binary"
      value: "composio"
      recommended: true
      description: "Recommended for app workflows: Composio CLI for connector discovery, schema inspection, OAuth-backed tool use, and MCP setup."
    - type: "binary"
      value: "python3"
      required: true
      description: "Local essential: Python runtime for the evidence engine and validation."
    - type: "binary"
      value: "git"
      required: true
      description: "Local essential: Git for source identity, revision, history, and staged clones."
    - type: "binary"
      value: "node"
      recommended: true
      description: "Conditional: Node.js 18+ for JavaScript packages and MCP setup."
    - type: "binary"
      value: "npm"
      recommended: true
      description: "Conditional: npm for JavaScript package metadata and verified setup."
    - type: "binary"
      value: "npx"
      recommended: true
      description: "Conditional: npx for skills.sh and one-shot package tools."
